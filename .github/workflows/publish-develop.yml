name: Build and publish NuGet packages

on:
  push:
    branches: [ develop, release ]
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write

jobs:
  publish-wiki:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish project documentation to GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        shell: pwsh
        run: .github/scripts/publish-wiki.ps1

  package-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build solution
        run: dotnet build Wastegate.Framework.Peripheral.sln --configuration Release

      - name: Pack changed packages
        if: github.event_name == 'pull_request' || github.ref_name == 'release'
        id: package
        env:
          RELEASE_MODE: ${{ github.event_name == 'push' && github.ref_name == 'release' }}
          CHANGED_PACKAGES_ONLY: ${{ github.event_name == 'pull_request' || github.ref_name == 'release' }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMPARE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: .github/scripts/pack-changed-packages.ps1

      - name: Publish changed packages to NuGet.org
        if: github.ref_name == 'release' && steps.package.outputs.package_count != '0'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'Configure the NUGET_API_KEY repository secret before publishing release packages.'
          }

          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'artifacts') -Filter '*.nupkg' -File | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet.org publish failed for $($_.Name) with exit code $LASTEXITCODE."
            }
          }

      - name: Create GitHub release
        if: (github.event_name == 'pull_request' || github.ref_name == 'release') && steps.package.outputs.package_count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'pull_request' && format('develop-pr-{0}-{1}', github.event.number, github.run_number) || format('release-{0}', github.run_number) }}
          name: ${{ github.event_name == 'pull_request' && format('Develop PR #{0} build {1}', github.event.number, github.run_number) || format('Release build {0}', github.run_number) }}
          body: Updated NuGet packages from ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }} at commit ${{ github.sha }}: ${{ steps.package.outputs.package_ids }}.
          target_commitish: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          prerelease: ${{ github.event_name == 'pull_request' }}
          files: artifacts/*.nupkg
          fail_on_unmatched_files: true
