name: Build and publish NuGet packages

on:
  push:
    branches: [ develop ]
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build solution
        run: dotnet build Wastegate.Framework.Peripheral.sln --configuration Release

      - name: Create NuGet packages
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tag '$env:GITHUB_REF_NAME' must be a semantic version such as 1.2.3 or v1.2.3."
            }
            $releaseTag = $env:GITHUB_REF_NAME
            $isPrerelease = 'false'
            $releaseName = "Release $version"
          }
          else {
            $version = "0.0.0-develop.$env:GITHUB_RUN_NUMBER"
            $releaseTag = "develop-$env:GITHUB_RUN_NUMBER"
            $isPrerelease = 'true'
            $releaseName = "Develop build $env:GITHUB_RUN_NUMBER"
          }

          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force $outputDirectory | Out-Null
          $projects = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter '*.csproj' -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj|artifacts|\.git|session-state)[\\/]' }
          if (-not $projects) {
            throw 'No library projects were found.'
          }

          $packageCount = 0
          foreach ($project in $projects) {
            $packageId = (dotnet msbuild $project.FullName -getProperty:PackageId | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect package metadata for $($project.FullName)."
            }
            if ([string]::IsNullOrWhiteSpace($packageId)) {
              continue
            }

            Write-Host "Packing $packageId from $($project.FullName) as version $version"
            dotnet pack $project.FullName --configuration Release --no-build --no-restore --output $outputDirectory "-p:PackageVersion=$version"
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet pack failed for $($project.FullName) with exit code $LASTEXITCODE."
            }
            $packageCount++
          }
          if ($packageCount -eq 0) {
            throw 'No projects with PackageId metadata were found.'
          }

          "tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "name=$releaseName" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Publish stable packages to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'Configure the NUGET_API_KEY repository secret before publishing a stable release.'
          }

          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'artifacts') -Filter '*.nupkg' -File | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet.org publish failed for $($_.Name) with exit code $LASTEXITCODE."
            }
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.name }}
          body: NuGet packages built from ${{ github.ref_name }} at commit ${{ github.sha }}.
          prerelease: ${{ steps.package.outputs.prerelease }}
          files: artifacts/*.nupkg
          fail_on_unmatched_files: true
